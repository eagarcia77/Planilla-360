name: PlanillaPR360 — QA
on:
  push:
    branches: [main]
    paths-ignore:
      - 'PlanillaPR360_v1.1.zip'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Confirmar que existe el código
        id: source
        run: |
          if test -f app/main.py && test -f RELEASE_MANIFEST.json && test -f requirements.txt; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Código pendiente de importación; las pruebas se activarán cuando llegue.'
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.source.outputs.ready == 'true'
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        if: steps.source.outputs.ready == 'true'
        with:
          node-version: '22'
      - name: Dependencias y pruebas
        if: steps.source.outputs.ready == 'true'
        run: |
          python -m pip install -r requirements.txt pytest
          PYTHONPATH=. python scripts/check_release.py
          PYTHONPATH=. python -m pytest -q
          python -m compileall -q app scripts
          node --check static/app.js
          node --check static/service-worker.js
